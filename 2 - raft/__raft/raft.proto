syntax = "proto3";

message logEntry {
    string msg = 1;
    int32 term = 2;
}

message AppendEntriesMsg {
    int32 term = 1;
    int32 leaderId = 2;
    int32 prevLogIndex = 3;
    int32 prevLogTerm = 4;
    repeated logEntry entries = 5;
    int32 leaderCommit = 6;

    // leader lease duration
    double leaseDuration = 7;
}

message AppendEntriesReply {
    int32 term = 1;
    bool success = 2;
}

message RequestVoteMsg {
    int32 term = 1;
    int32 candidateId = 2;
    int32 lastLogIndex = 3;
    int32 lastLogTerm = 4;
}

message RequestVoteReply {
    int32 term = 1;
    bool voteGranted = 2;

    // old leader's remaining lease
    double longestRemainingOldLeaderLease = 3;
}

// Service for a raft client 
message ServeClientArgs {
  string Request = 1;
}

message ServeClientReply {
  string data = 1;
  int32 leaderID = 2;
  bool success = 3;
}

service RaftClientService {
    rpc ServeClient(ServeClientArgs) returns (ServeClientReply) {}
}

service RaftNodeServices {
    rpc AppendEntries(AppendEntriesMsg) returns (AppendEntriesReply) {}

    rpc RequestVote(RequestVoteMsg) returns (RequestVoteReply) {}
}