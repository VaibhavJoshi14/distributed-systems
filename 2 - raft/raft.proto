syntax = "proto3";

message logEntry {
    string msg = 1;
    int32 term = 2;
}

message AppendEntriesMsg {
    int32 term = 1;
    int32 leaderId = 2;
    int32 prevLogIndex = 3;
    int32 prevLogTerm = 4;
    repeated logEntry entries = 5;
    int32 leaderCommit = 6;

}

message Response {
    int32 term = 1;
    bool success = 2;
}

service AppendEntries {
    rpc Send(AppendEntriesMsg) returns (Response) {}
}

message RequestVoteMsg {
    int32 term = 1;
    int32 candidateId = 2;
    int32 lastLogIndex = 3;
    int32 lastLogTerm = 4;
}

service RequestVote {
    rpc Send(RequestVoteMsg) returns (Response) {}
}
